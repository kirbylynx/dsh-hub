name: dsh-hub-m2-existing-caddy

x-dsh-hub-log-retention: &dsh-hub-log-retention
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

services:
  lldap:
    image: lldap/lldap:stable
    restart: unless-stopped
    network_mode: host
    logging: *dsh-hub-log-retention
    environment:
      LLDAP_LDAP_HOST: 127.0.0.1
      LLDAP_LDAP_PORT: ${LLDAP_LDAP_BIND_PORT}
      LLDAP_HTTP_HOST: 127.0.0.1
      LLDAP_HTTP_PORT: ${LLDAP_HTTP_BIND_PORT}
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN}
      LLDAP_LDAP_USER_DN: ${LLDAP_ADMIN_USERNAME}
      LLDAP_JWT_SECRET_FILE: /run/secrets/lldap_jwt_secret
      LLDAP_KEY_SEED_FILE: /run/secrets/lldap_key_seed
      LLDAP_LDAP_USER_PASS_FILE: /run/secrets/lldap_admin_password
    secrets:
      - lldap_jwt_secret
      - lldap_key_seed
      - lldap_admin_password
    volumes:
      - lldap_data:/data

  authelia:
    image: authelia/authelia:4
    restart: unless-stopped
    network_mode: host
    logging: *dsh-hub-log-retention
    depends_on:
      - lldap
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_encryption_key
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /run/secrets/lldap_admin_password
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_encryption_key
      - lldap_admin_password
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - authelia_data:/config/data

  dsh-hub-service:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    logging: *dsh-hub-log-retention
    command:
      - node
      - packages/dsh-hub-service/bin/dsh-hub-service.js
      - --host
      - 127.0.0.1
      - --port
      - ${DSH_HUB_SERVICE_BIND_PORT}
      - --db
      - /data/hub.db
      - --base-domain
      - ${BASE_DOMAIN}
      - --portal-host
      - ${PORTAL_HOST}
      - --control-host
      - ${CONTROL_HOST}
      - --instance-base-domain
      - ${INSTANCE_BASE_DOMAIN}
      - --public-scheme
      - ${PUBLIC_SCHEME}
      - --trusted-proxy-cidrs
      - ${TRUSTED_PROXY_CIDRS}
      - --trusted-user-header
      - ${TRUSTED_USER_HEADER}
    environment:
      TOKEN_PEPPER_KEYRING_FILE: /run/secrets/token_pepper_keyring
      CURRENT_TOKEN_PEPPER_KEY_ID: ${CURRENT_TOKEN_PEPPER_KEY_ID}
      IDEMPOTENCY_ENCRYPTION_KEYRING_FILE: /run/secrets/idempotency_encryption_keyring
      CURRENT_IDEMPOTENCY_ENCRYPTION_KEY_ID: ${CURRENT_IDEMPOTENCY_ENCRYPTION_KEY_ID}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
      AUTH_LOGOUT_URL: ${AUTH_LOGOUT_URL}
      BOOTSTRAP_SYSTEM_ADMIN_USERNAME: ${BOOTSTRAP_SYSTEM_ADMIN_USERNAME}
      LLDAP_MODE: graphql
      LLDAP_HTTP_URL: http://127.0.0.1:${LLDAP_HTTP_BIND_PORT}
      LLDAP_LDAP_URL: ldap://127.0.0.1:${LLDAP_LDAP_BIND_PORT}
      LLDAP_ADMIN_USERNAME: ${LLDAP_ADMIN_USERNAME}
      LLDAP_ADMIN_PASSWORD_FILE: /run/secrets/lldap_admin_password
      LLDAP_BASE_DN: ${LLDAP_BASE_DN}
      LLDAP_ADMISSION_GROUP: ${LLDAP_ADMISSION_GROUP}
    secrets:
      - token_pepper_keyring
      - idempotency_encryption_keyring
      - lldap_admin_password
    volumes:
      - hub_data:/data

secrets:
  token_pepper_keyring:
    file: ${TOKEN_PEPPER_KEYRING_SECRET_FILE}
  idempotency_encryption_keyring:
    file: ${IDEMPOTENCY_ENCRYPTION_KEYRING_SECRET_FILE}
  authelia_jwt_secret:
    file: ${AUTHELIA_JWT_SECRET_FILE}
  authelia_session_secret:
    file: ${AUTHELIA_SESSION_SECRET_FILE}
  authelia_storage_encryption_key:
    file: ${AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE}
  lldap_jwt_secret:
    file: ${LLDAP_JWT_SECRET_FILE}
  lldap_key_seed:
    file: ${LLDAP_KEY_SEED_FILE}
  lldap_admin_password:
    file: ${LLDAP_ADMIN_PASSWORD_FILE}

volumes:
  authelia_data:
  lldap_data:
  hub_data:

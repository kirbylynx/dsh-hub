theme: auto

server:
  address: tcp://127.0.0.1:19091/

log:
  level: info

totp:
  issuer: dsh-hub

authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://127.0.0.1:3890
    base_dn: dc=dsh,dc=hub
    user: uid=admin,ou=people,dc=dsh,dc=hub

access_control:
  default_policy: deny
  rules:
    - domain:
        - hub.example.com
        - "*.instances.hub.example.com"
      subject: "group:dsh-hub-users"
      policy: one_factor

session:
  cookies:
    - domain: hub.example.com
      authelia_url: https://auth.hub.example.com
      default_redirection_url: https://hub.example.com

storage:
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notification.txt

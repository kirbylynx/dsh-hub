theme: auto

server:
  address: tcp://127.0.0.1:19091/

log:
  level: info

totp:
  issuer: dsh-hub

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      key_length: 32
      salt_length: 16
      memory: 65536
      parallelism: 4

access_control:
  default_policy: deny
  rules:
    - domain:
        - hub.example.com
        - "*.instances.hub.example.com"
      policy: one_factor

session:
  cookies:
    - domain: hub.example.com
      authelia_url: https://auth.hub.example.com
      default_redirection_url: https://hub.example.com

storage:
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notification.txt

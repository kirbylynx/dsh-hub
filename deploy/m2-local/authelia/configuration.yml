theme: auto

server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

totp:
  issuer: dsh-hub

authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    base_dn: dc=dsh,dc=hub
    user: uid=admin,ou=people,dc=dsh,dc=hub

access_control:
  default_policy: deny
  rules:
    - domain:
        - dsh.example.test
        - "*.instances.dsh.example.test"
      subject: "group:dsh-hub-users"
      policy: one_factor

session:
  cookies:
    - domain: dsh.example.test
      authelia_url: https://auth.dsh.example.test
      default_redirection_url: https://dsh.example.test

storage:
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notification.txt
